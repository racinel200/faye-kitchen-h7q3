<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)">
<title>Faye Kitchen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5D3A'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23F6F1E7' font-family='Georgia'%3EF%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#F6F1E7; --card:#FFFDF8; --ink:#24221E; --muted:#6F6A60; --line:#E4DCCB;
  --green:#2F5D3A; --green-soft:#E3EDE3; --tomato:#C2452D; --tomato-soft:#F7E2DC; --gold:#B7862F;
  --heb:#D2232A; --wf:#00674B; --wm:#0071CE; --bubble:#2F5D3A; --bubble-ink:#FFFDF8;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1A17; --card:#25231F; --ink:#EEE8DC; --muted:#A39C8E; --line:#38352F;
    --green:#7FB08A; --green-soft:#2A3A2D; --tomato:#E2775F; --tomato-soft:#3D2620; --gold:#D6A852;
    --bubble:#3E6B48; --bubble-ink:#F6F1E7; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;flex:1}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot i{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dot.on i{background:#3BA55C}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.view{display:none}.view.active{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:10px 4px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.active{color:var(--green);font-weight:600}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--tomato);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:10px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:var(--green-soft);color:var(--green)}
.btn.warn{background:var(--tomato)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);font-weight:600;white-space:nowrap}
.chip.red{background:var(--tomato-soft);color:var(--tomato)}
.chip.gray{background:var(--line);color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.msg{max-width:88%;padding:10px 13px;border-radius:18px;white-space:normal;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--bubble);color:var(--bubble-ink);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul{margin:4px 0 6px;padding-left:20px}.msg li{margin:2px 0}
.typing{align-self:flex-start;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.composer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:4;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 16px 8px}
.composer form{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;max-height:120px;border-radius:20px;padding:10px 14px}
.composer .btn{border-radius:50%;width:44px;height:44px;padding:0;flex:none}
.composer .mic{background:var(--green-soft);color:var(--green)}
.composer .mic.on{background:var(--tomato);color:#fff;animation:pulse 1.2s infinite}
.composer .mic[hidden]{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,69,45,.45)}70%{box-shadow:0 0 0 10px rgba(194,69,45,0)}}
@media (prefers-reduced-motion:reduce){.composer .mic.on{animation:none}}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.starters button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:14px}
/* plan */
.day h3{font-size:17px;margin-bottom:6px}
.meal{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .slot{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:70px;flex:none;padding-top:3px}
.meal .name{font-weight:600}
/* list */
.store-h{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.store-h h2{font-size:19px;flex:1}
.store-h .bar{width:6px;height:22px;border-radius:3px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.item .top{display:flex;gap:8px;align-items:flex-start}
.item .nm{flex:1;font-weight:600}
.item .sub{font-size:13px;color:var(--muted)}
.item .x{color:var(--muted);padding:2px 4px;font-size:18px;line-height:1}
.item .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.cands{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 4px;scroll-snap-type:x mandatory}
.cand{flex:0 0 150px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.cand img{width:100%;height:100px;object-fit:contain;background:#fff;border-radius:8px}
.cand .t{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:48px}
.cand .p{font-weight:700;font-size:14px}
.cand .f{font-size:11px;color:var(--green);font-weight:600;min-height:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input[name=name]{flex:2 1 180px}.addrow input[name=qty]{flex:1 1 70px}.addrow select{flex:1 1 110px}
/* checkout */
.lines{margin:8px 0;padding:0;list-style:none;font-size:14px}
.lines li{padding:5px 0;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 11px;font-size:13px}
.chips button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.total{font-family:Georgia,serif;font-size:30px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin:8px 0}
.kv b{font-weight:600;text-align:right}
.pin{display:flex;gap:8px;align-items:center;margin-top:10px}
.pin input{width:120px;text-align:center;letter-spacing:.4em;font-size:20px}
.err{color:var(--tomato);font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 10px}
</style>
</head>
<body>
<header>
  <h1>Faye Kitchen</h1>
  <span class="dot" id="conn" title="Store connection"><i></i><span>…</span></span>
</header>

<main>
  <section class="view active" id="v-chat">
    <div id="chatlog"></div>
  </section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-checkout"></section>
  <footer>build <span id="build">2026-10-30a</span></footer>
</main>

<div class="composer" id="composer">
  <form id="chatform" autocomplete="off">
    <button type="button" class="btn mic" id="micbtn" aria-label="Talk" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <textarea id="chatin" rows="1" placeholder="Ask about meals, or say what you need…"></textarea>
    <button class="btn" id="sendbtn" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</div>

<nav class="tabs" id="tabs">
  <button data-v="chat" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z" stroke-linejoin="round"/></svg>Chat</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Week</button>
  <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>List<span class="badge" id="b-list" hidden></span></button>
  <button data-v="checkout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>Carts</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const API = "https://wopiuwndpuxzywtchbtt.supabase.co/functions/v1/kitchen";
const STORES = {
  heb: { name: "H-E-B", color: "var(--heb)", cart: true, mode: "Curbside" },
  wholefoods: { name: "Whole Foods", color: "var(--wf)", cart: true },
  walmart: { name: "Walmart", color: "var(--wm)", cart: true, mode: "Delivery" },
};
let TOKEN = null, S = null, view = "chat", busyChat = false, pollT = null;
const ui = { slot: {}, mode: {}, pin: {}, err: {}, adding: false };

// ---- token: from the link (#k=...) once, then remembered on this phone
(function () {
  const m = location.hash.match(/k=([0-9a-f]{20,})/);
  try {
    if (m) { localStorage.setItem("fk_token", m[1]); history.replaceState(null, "", location.pathname); }
    TOKEN = (m && m[1]) || localStorage.getItem("fk_token");
  } catch (e) { TOKEN = m && m[1]; }
})();

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); }

async function api(op, body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-kitchen-token": TOKEN }, body: JSON.stringify({ op, ...body }) });
  const j = await r.json().catch(() => ({ error: "Network trouble" }));
  if (j.error) throw new Error(j.error);
  return j;
}
async function act(op, body = {}, quiet = false) {
  try { S = await api(op, body); render(); schedule(); return true; }
  catch (e) { if (!quiet) toast(e.message); return false; }
}

// ---- markdown-lite for chat replies
function md(s) {
  const lines = esc(s).split(/\n/); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)\*(\S.+?)\*(?=\s|$)/g, "$1<i>$2</i>");
    const li = l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${li[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    if (h) { out += `<p><b>${h[1]}</b></p>`; continue; }
    if (l.trim()) out += `<p>${l}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

// ---- render
function render() {
  if (!S) return;
  const c = $("#conn"); c.classList.toggle("on", S.worker_online);
  c.querySelector("span").textContent = S.worker_online ? "Stores connected" : "Stores offline";
  c.title = S.worker_online ? "Racine's computer is on: carts update right away." : "Racine's computer is asleep: cart actions wait until it wakes.";
  const need = S.items.filter((i) => i.status === "choose").length;
  const b = $("#b-list"); b.hidden = !need; b.textContent = need;
  renderChat(); renderPlan(); renderList(); renderCheckout();
}

function renderChat() {
  const log = $("#chatlog");
  const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  let h = "";
  if (!S.messages.length) {
    h += `<div class="card"><h2 style="font-size:20px;margin-bottom:6px">Hi Angie 👋</h2>
      <div class="muted">Tell me what sounds good this week, what you're craving, or what's in the fridge. I'll suggest meals, put things on the list, and when you say so I'll find them at H-E-B, Whole Foods or Walmart and drop them in the cart. Tap the mic to talk instead of typing.</div></div>
      <div class="starters">${["Plan dinners for this week", "Something quick tonight with chicken", "High-protein lunches I can prep", "What can I make with what we have?"]
        .map((s) => `<button data-starter="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  }
  for (const m of S.messages) h += `<div class="msg ${m.role}">${m.role === "assistant" ? md(m.content) : esc(m.content).replace(/\n/g, "<br>")}</div>`;
  if (busyChat) h += `<div class="typing"><span class="spin"></span> ${S.pending > 0 ? "Checking the store… (can take a minute)" : "Thinking…"}</div>`;
  log.innerHTML = h;
  if (atBottom || busyChat) window.scrollTo(0, document.body.scrollHeight);
}

function renderPlan() {
  const el = $("#v-plan"); const p = S.plan?.plan;
  const wk = new Date(S.week_start + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  let h = `<h2 style="font-size:22px;margin:6px 0 2px">This week</h2><div class="muted small">Week of ${wk}</div>`;
  if (!p || !p.days?.length) {
    h += `<div class="empty">No plan yet.<br><button class="btn ghost" style="margin-top:12px" data-starter="Plan dinners for this week">Plan this week with Claude</button></div>`;
  } else {
    for (const d of p.days) {
      h += `<div class="card day"><h3>${esc(d.day)}</h3>`;
      for (const m of d.meals || []) {
        const mac = [m.cal ? `~${Math.round(m.cal)} cal` : "", m.protein ? `${Math.round(m.protein)} g protein` : ""].filter(Boolean).join(" · ");
        h += `<div class="meal"><div class="slot">${esc(m.slot)}</div><div><div class="name">${esc(m.name)}</div>
          ${mac ? `<div class="small" style="color:var(--green);font-weight:600">${mac}</div>` : ""}
          ${m.how ? `<div class="small muted">${esc(m.how)}</div>` : ""}${m.source ? `<div class="small muted"><i>${esc(m.source)}</i></div>` : ""}</div></div>`;
      }
      h += `</div>`;
    }
    h += `<div style="text-align:center;margin:10px 0"><button class="btn ghost sm" data-starter="Let's change this week's plan">Change the plan</button></div>`;
  }
  el.innerHTML = h;
}

function statusChip(i) {
  const map = {
    list: ["Not in cart", "gray"], searching: ["Looking…", ""], choose: ["Pick one", "red"], adding: ["Updating cart…", ""],
    in_cart: [`In cart${i.cart_qty > 1 ? " ×" + i.cart_qty : ""} ✓`, ""], not_found: ["Not found", "red"], error: ["Problem", "red"],
  };
  const [t, cls] = map[i.status] || [i.status, "gray"];
  const sp = ["searching", "adding"].includes(i.status) ? `<span class="spin" style="width:10px;height:10px"></span>` : "";
  return `<span class="chip ${cls}">${sp}${esc(t)}</span>`;
}

function renderList() {
  const el = $("#v-list");
  if (ui.adding && el.contains(document.activeElement)) return; // don't wipe the add form while typing
  let h = `<div class="card"><form id="addform" class="addrow" autocomplete="off">
      <input name="name" placeholder="Add an item" required>
      <input name="qty" placeholder="How many">
      <select name="store">${Object.entries(STORES).map(([k, s]) => `<option value="${k}">${s.name}</option>`).join("")}</select>
      <button class="btn" style="flex:1 1 80px">Add</button></form></div>`;
  const by = {}; for (const i of S.items) (by[i.store] ||= []).push(i);
  if (!S.items.length) h += `<div class="empty">The list is empty. Ask in Chat for meal ideas, or add something above.</div>`;
  for (const [k, st] of Object.entries(STORES)) {
    const its = by[k]; if (!its?.length) continue;
    const todo = its.filter((i) => ["list", "not_found", "error"].includes(i.status)).length;
    h += `<div class="store-h"><span class="bar" style="background:${st.color}"></span><h2>${st.name}</h2>
      ${todo > 1 ? `<button class="btn sm ghost" data-findall="${k}">Find all ${todo}</button>` : ""}</div>`;
    for (const i of its) h += itemCard(i);
  }
  el.innerHTML = h;
}

function itemCard(i) {
  const st = STORES[i.store];
  let acts = "";
  if (["list", "not_found", "error"].includes(i.status)) acts = `<button class="btn sm" data-find="${i.id}">Add to ${st.name} cart</button>`;
  if (i.status === "choose") {
    const c = i.candidates || [];
    acts = `<div style="width:100%"><div class="small muted">${c[0]?.usual ? "You've bought this before:" : "Which one?"}</div><div class="cands">` +
      c.map((p, n) => `<div class="cand">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        <div class="t">${esc(p.title)}</div><div class="p">${esc(p.price || "")}</div><div class="f">${esc(p.usual ? "Your usual" : (p.text || "").replace(/·\s*$/, ""))}</div>
        <button class="btn sm" data-pick="${i.id}:${n}">Add</button></div>`).join("") +
      `</div><button class="btn sm ghost" data-refind="${i.id}">${c[0]?.usual ? "See other options" : "Search again"}</button></div>`;
  }
  if (i.status === "in_cart" && i.product?.title) acts = `<span class="small muted">${esc(i.product.title)}${i.product.price ? " · " + esc(i.product.price) : ""}</span>`;
  const err = i.error && ["error", "not_found"].includes(i.status) ? `<div class="err">${esc(i.error)}</div>` : "";
  return `<div class="item"><div class="top"><div class="nm">${esc(i.name)}<div class="sub">${[i.qty, i.meal].filter(Boolean).map(esc).join(" · ")}</div></div>
    ${statusChip(i)}<button class="x" data-rm="${i.id}" aria-label="Remove">×</button></div>
    ${acts ? `<div class="acts">${acts}</div>` : ""}${err}</div>`;
}

function renderCheckout() {
  const el = $("#v-checkout");
  if (el.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return; // keep PIN focus
  let h = "";
  if (!S.pin_set) h += `<div class="card"><h3 style="font-size:18px">Set your checkout PIN</h3>
    <div class="muted small">Pick 4 digits only you know. You'll enter it every time you place an order.</div>
    <div class="pin"><input id="newpin" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="••••"><button class="btn" data-setpin>Save PIN</button></div></div>`;
  for (const [k, st] of Object.entries(STORES)) {
    if (!st.cart) continue;
    const co = S.checkouts.find((c) => c.store === k);
    const snap = S.carts.find((c) => c.store === k);
    const cart = snap?.snapshot;
    const age = snap ? Math.round((Date.now() - Date.parse(snap.updated_at)) / 60000) : null;
    h += `<div class="card"><div class="store-h" style="margin:0 0 2px"><span class="bar" style="background:${st.color}"></span><h2>${st.name}</h2>
      <button class="btn sm ghost" data-cartref="${k}">Refresh</button></div>
      <div class="small muted" style="margin-bottom:6px">${age == null ? "Not checked yet" : age < 1 ? "Checked just now" : `Checked ${age < 60 ? age + " min" : Math.round(age / 60) + " hr"} ago`}</div>`;
    h += checkoutBody(k, co, cart);
    h += `</div>`;
  }
  el.innerHTML = h;
}

function lineList(lines) {
  if (!lines?.length) return `<div class="muted small">Cart is empty.</div>`;
  return `<ul class="lines">${lines.map((l) => `<li>${esc(l.qty > 1 ? l.qty + " × " : "")}${esc(l.name || l.text)}${l.price ? ` <span class="muted">$${Number(l.price).toFixed(2)}</span>` : ""}</li>`).join("")}</ul>`;
}

function checkoutBody(k, co, cart) {
  const live = co && !["cancelled", "placed"].includes(co.status) ? co : null;
  if (co?.status === "placed" && !live) {
    return `<div class="chip" style="font-size:14px;padding:6px 12px">Order placed ✓</div><div class="small muted" style="margin-top:6px">$${Number(co.total).toFixed(2)}${co.slot ? " · " + esc(co.day + " " + co.slot) : ""}</div>
      <button class="btn sm ghost" style="margin-top:8px" data-costart="${k}">Start a new checkout</button>`;
  }
  if (!live) {
    const n = cart?.lines?.length;
    let h = cart ? `<div class="small muted">${n} item${n === 1 ? "" : "s"} in the cart${cart.subtotal ? ` · $${Number(cart.subtotal).toFixed(2)}` : ""}</div>${lineList(cart.lines)}` : `<div class="small muted">Tap Refresh cart to see what's in it.</div>`;
    if (k === "heb") h += `<div class="chips">${["Curbside", "Delivery"].map((m) => `<button class="${(ui.mode[k] || "Curbside") === m ? "sel" : ""}" data-mode="${k}:${m}">${m}</button>`).join("")}</div>`;
    if (k === "walmart") h += `<div class="small muted" style="margin-top:4px">${cart?.mode === "Delivery" ? "InHome delivery to the house." : cart?.mode ? "The cart is set to " + esc(cart.mode).toLowerCase() + " — open the Walmart app, tap Delivery in the cart, then Refresh here." : ""}</div>`;
    return h + `<button class="btn" data-costart="${k}" style="margin-top:6px">Checkout</button>`;
  }
  const s = live.status, rv = live.review || {};
  if (["reviewing", "totaling", "placing"].includes(s)) {
    const t = { reviewing: "Checking the cart and times…", totaling: "Holding your time and getting the final total…", placing: "Placing the order…" }[s];
    return `<div class="muted"><span class="spin"></span> ${t}</div><div class="small muted" style="margin-top:4px">About 20–60 seconds.</div>`;
  }
  if (s === "failed") return `<div class="err">${esc(live.error || "Something went wrong.")}</div><button class="btn sm ghost" style="margin-top:8px" data-costart="${k}">Try again</button>`;
  let h = `<div class="small muted">Everything below gets ordered — not just what you added.</div>${lineList(rv.lines)}`;
  if (k === "walmart") {
    const rs = live.result || {};
    h += `<div class="kv"><span>Items subtotal</span><b>${rv.subtotal != null ? "$" + Number(rv.subtotal).toFixed(2) : "—"}</b><span>How</span><b>InHome delivery</b></div>`;
    const slots = rv.slots || [];
    h += `<div class="small" style="margin-top:6px"><b>Delivery window</b></div><div class="chips">${slots.length ? slots.map((x) => `<button class="${ui.slot[live.id] === x || live.slot === x ? "sel" : ""}" data-slot="${live.id}:${esc(x)}">${esc(x)}</button>`).join("") : `<span class="muted small">No windows showing. Open the Walmart app to pick one.</span>`}</div>`;
    if (s === "review_ready") {
      const pick = ui.slot[live.id];
      h += `<button class="btn" ${pick ? "" : "disabled"} data-total="${live.id}">Get final total</button><div class="small muted" style="margin-top:4px">Opens checkout to read the real total. Nothing is ordered yet.</div>`;
    }
    if (s === "total_ready") h += `<div class="kv" style="margin-top:6px">${rs.delivery_fee != null ? `<span>Delivery</span><b>${esc(String(rs.delivery_fee))}</b>` : ""}${rs.tax != null ? `<span>Tax</span><b>$${Number(rs.tax).toFixed(2)}</b>` : ""}${rs.tip ? `<span>Tip</span><b>${esc(String(rs.tip))}</b>` : ""}${rs.card ? `<span>Card</span><b>${esc(rs.card)}</b>` : ""}</div>`;
  } else if (k === "heb") {
    h += `<div class="kv"><span>Items subtotal</span><b>${rv.subtotal != null ? "$" + Number(rv.subtotal).toFixed(2) : "—"}</b><span>How</span><b>${esc(rv.mode || live.mode || "Curbside")}</b></div>`;
    const days = (rv.days || []).map((d) => ({ raw: d, word: d.split(" ")[0], label: d.replace(/\s*\[selected\]/, "").replace(/\s+Free$/, ""), sel: /\[selected\]/.test(d) }));
    h += `<div class="small" style="margin-top:6px"><b>Day</b></div><div class="chips">${days.map((d) => `<button class="${d.sel ? "sel" : ""}" data-day="${live.id}:${esc(d.word)}">${esc(d.label)}</button>`).join("")}</div>`;
    const slots = (rv.slots || []).map((x) => x.replace(/ for .*$/, ""));
    h += `<div class="small"><b>Time</b></div><div class="chips">${slots.length ? slots.map((x) => `<button class="${ui.slot[live.id] === x || live.slot === x ? "sel" : ""}" data-slot="${live.id}:${esc(x)}">${esc(x)}</button>`).join("") : `<span class="muted small">No open times that day.</span>`}</div>`;
    if (s === "review_ready") {
      const pick = ui.slot[live.id];
      h += `<button class="btn" ${pick ? "" : "disabled"} data-total="${live.id}">Get final total</button><div class="small muted" style="margin-top:4px">This holds the time slot.</div>`;
    }
  } else {
    h += `<div class="kv"><span>Items</span><b>$${Number(rv.subtotal ?? 0).toFixed(2)}</b>
      ${rv.delivery_fee != null ? `<span>Delivery</span><b>$${Number(rv.delivery_fee).toFixed(2)}</b>` : ""}
      ${rv.tax != null ? `<span>Tax</span><b>$${Number(rv.tax).toFixed(2)}</b>` : ""}
      ${rv.tip != null ? `<span>Tip (Amazon's default)</span><b>$${Number(rv.tip).toFixed(2)}</b>` : ""}
      ${rv.window ? `<span>Arrives</span><b>${esc(rv.window)}</b>` : ""}
      ${rv.hold ? `<span>Card hold</span><b>$${Number(rv.hold).toFixed(2)}</b>` : ""}</div>`;
  }
  const twoStep = k === "heb" || k === "walmart";
  const ready = (twoStep && s === "total_ready") || (!twoStep && s === "review_ready");
  if (ready && live.total != null) {
    h += `<div style="margin-top:10px" class="muted small">Total</div><div class="total">$${Number(live.total).toFixed(2)}</div>
      ${k === "heb" ? `<div class="small muted">${esc(live.mode)} · ${esc(live.day)} ${esc(live.slot)}</div>` : k === "walmart" ? `<div class="small muted">${esc(live.slot || "")}</div>` : ""}
      <div class="pin"><input id="pin-${live.id}" inputmode="numeric" maxlength="4" placeholder="PIN">
      <button class="btn warn" data-place="${live.id}:${live.total}">Place order</button></div>`;
  }
  return h + `<div style="margin-top:10px"><button class="btn sm ghost" data-cocancel="${live.id}">Cancel</button></div>`;
}

// ---- events
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (t.closest("#tabs")) { show(d.v); return; }
  if (d.starter) { show("chat"); $("#chatin").value = d.starter; send(); return; }
  if (d.find) { t.disabled = true; await act("find", { id: +d.find }); }
  if (d.refind) { t.disabled = true; await act("find", { id: +d.refind, fresh: true }); }
  if (d.findall) { t.disabled = true; await act("find_all", { store: d.findall }); }
  if (d.pick) { const [id, n] = d.pick.split(":"); t.disabled = true; await act("pick", { id: +id, index: +n }); }
  if (d.rm) { if (confirm("Remove this from the list" + (S.items.find((i) => i.id == d.rm)?.status === "in_cart" ? " and the cart?" : "?"))) await act("item_remove", { id: +d.rm }); }
  if (d.cartref) { t.disabled = true; await act("cart_refresh", { store: d.cartref }); toast("Checking the cart…"); }
  if (d.got) await act("item_got", { id: +d.got });
  if (d.mode) { const [k, m] = d.mode.split(":"); ui.mode[k] = m; render(); }
  if (d.costart) { t.disabled = true; await act("checkout_start", { store: d.costart, mode: ui.mode[d.costart] || STORES[d.costart].mode || "Curbside" }); }
  if (d.day) { const [id, day] = d.day.split(":"); const co = S.checkouts.find((c) => c.id == id); delete ui.slot[id]; await act("checkout_day", { checkout_id: +id, day, mode: co?.review?.mode || co?.mode || "Curbside" }); }
  if (d.slot) { const i = d.slot.indexOf(":"); ui.slot[d.slot.slice(0, i)] = d.slot.slice(i + 1); render(); }
  if (d.total) {
    const co = S.checkouts.find((c) => c.id == d.total);
    const day = co.store === "walmart" ? null : ((co.review?.days || []).find((x) => /\[selected\]/.test(x))?.split(" ")[0] || co.day);
    t.disabled = true; await act("checkout_total", { checkout_id: co.id, mode: co.review?.mode || co.mode || STORES[co.store].mode || "Curbside", day, slot: ui.slot[co.id] });
  }
  if (d.place) {
    const [id, tot] = d.place.split(":"); const pin = $("#pin-" + id)?.value || "";
    if (!/^\d{4}$/.test(pin)) { toast("Enter your 4-digit PIN"); return; }
    if (!confirm(`Place this order for $${Number(tot).toFixed(2)}?`)) return;
    t.disabled = true; await act("checkout_place", { checkout_id: +id, pin, expect_total: +tot });
  }
  if (d.cocancel) await act("checkout_cancel", { checkout_id: +d.cocancel });
  if ("setpin" in d) {
    const p = $("#newpin").value; if (!/^\d{4}$/.test(p)) { toast("PIN must be 4 digits"); return; }
    if (await act("set_pin", { pin: p })) toast("PIN saved");
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id === "addform") {
    e.preventDefault(); const f = new FormData(e.target);
    ui.adding = false;
    await act("item_add", { name: f.get("name"), qty: f.get("qty") || null, store: f.get("store") });
    toast("Added to the list");
  }
});
document.addEventListener("focusin", (e) => { if (e.target.closest("#addform")) ui.adding = true; });
document.addEventListener("focusout", (e) => { if (e.target.closest("#addform")) setTimeout(() => { ui.adding = false; }, 300); });

$("#chatform").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("#chatin").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); send(); } });
$("#chatin").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; });

let spoke = false;
async function send(viaVoice = false) {
  const box = $("#chatin"); const text = box.value.trim(); if (!text || busyChat) return;
  box.value = ""; box.style.height = "auto"; spoke = viaVoice;
  const lastId = S.messages.length ? S.messages[S.messages.length - 1].id : 0;
  S.messages.push({ role: "user", content: text }); busyChat = true; $("#sendbtn").disabled = true; renderChat();
  try {
    S = await api("chat", { message: text });
    await waitForReply(lastId);
  } catch (err) { toast(err.message); }
  busyChat = false; $("#sendbtn").disabled = false; render(); schedule();
}
// the reply is written in the background; poll until it shows up (or the server says it's no longer busy)
async function waitForReply(afterId) {
  const until = Date.now() + 170000;
  while (Date.now() < until) {
    const got = S.messages.find((m) => m.role === "assistant" && m.id > afterId);
    if (got) { if (spoke) say(got.content); return; }
    if (!S.chat_pending) return;
    render();
    await new Promise((r) => setTimeout(r, 2000));
    try { S = await api("view"); } catch (e) { /* keep polling */ }
  }
}

// ---- voice: tap the mic, talk, it sends when you stop; the reply is read back
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false;
if (SR) {
  const mic = $("#micbtn"); mic.hidden = false;
  mic.addEventListener("click", () => {
    if (recActive) { rec.stop(); return; }
    if (busyChat) return;
    try { speechSynthesis.cancel(); } catch (e) {}
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText = "";
    rec.onstart = () => { recActive = true; mic.classList.add("on"); $("#chatin").placeholder = "Listening…"; };
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t; else interim += t; }
      $("#chatin").value = (finalText + interim).trim();
    };
    rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") toast("Couldn't hear you — check the mic permission"); };
    rec.onend = () => {
      recActive = false; mic.classList.remove("on"); $("#chatin").placeholder = "Ask about meals, or say what you need…";
      if ($("#chatin").value.trim()) send(true);
    };
    try { rec.start(); } catch (e) { toast("Mic isn't available here"); }
  });
}
function say(text) {
  if (!("speechSynthesis" in window)) return;
  const plain = String(text).replace(/\*\*|__|`/g, "").replace(/^#+\s*/gm, "").replace(/^\s*[-•*]\s+/gm, "").replace(/\s+/g, " ").trim().slice(0, 1200);
  if (!plain) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain); u.lang = "en-US"; u.rate = 1.02;
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) {} } });

function show(v) {
  view = v;
  document.querySelectorAll(".view").forEach((x) => x.classList.toggle("active", x.id === "v-" + v));
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("active", x.dataset.v === v));
  $("#composer").style.display = v === "chat" ? "" : "none";
  window.scrollTo(0, v === "chat" ? document.body.scrollHeight : 0);
  if (v === "checkout" && S?.worker_online) {   // carts older than 10 min get re-read when she opens the tab
    for (const k of Object.keys(STORES).filter((k) => STORES[k].cart)) {
      const snap = S.carts.find((c) => c.store === k);
      const co = S.checkouts.find((c) => c.store === k && !["cancelled", "placed", "failed"].includes(c.status));
      if (!co && (!snap || Date.now() - Date.parse(snap.updated_at) > 600000)) api("cart_refresh", { store: k }).then((r) => { S = r; render(); schedule(); }).catch(() => {});
    }
  }
}

// ---- polling: fast while the stores are working, slow otherwise
function busy() {
  return S && (S.pending > 0 || S.chat_pending || S.items.some((i) => ["searching", "adding"].includes(i.status)) ||
    S.checkouts.some((c) => ["reviewing", "totaling", "placing"].includes(c.status)));
}
function schedule() {
  // a reply still being written when the page opened (or re-opened): show the typing dots until it lands, but only if her message is the newest one
  if (S?.chat_pending && !busyChat && S.messages.length && S.messages[S.messages.length - 1].role === "user") {
    busyChat = true; const last = [...S.messages].reverse().find((m) => m.role === "assistant")?.id || 0;
    waitForReply(last).finally(() => { busyChat = false; render(); });
  }
  clearTimeout(pollT);
  pollT = setTimeout(async () => { if (!document.hidden && !busyChat) { try { S = await api("view"); render(); } catch (e) { } } schedule(); }, busy() ? 3000 : 20000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) act("view", {}, true); });

(async function boot() {
  if (!TOKEN) { $("main").innerHTML = `<div class="empty">Open this page from the link Racine sent you.</div>`; $("#composer").style.display = "none"; return; }
  try { S = await api("view"); render(); show("chat"); schedule(); }
  catch (e) { $("main").innerHTML = `<div class="empty">${e.message === "forbidden" ? "This link isn't valid anymore. Ask Racine for a new one." : "Couldn't load. Check your connection and refresh."}</div>`; }
})();
</script>
</body>
</html>
